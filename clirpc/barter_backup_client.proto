syntax = "proto3";

package clirpc;

// BarterBackupClient is the local gRPC service exposed by the daemon.
service BarterBackupClient {
    // State returns the current local daemon status.
    rpc State(StateRequest) returns (StateResponse);

    // GetTestTime returns the daemon's current injected application clock when
    // test-clock mode is enabled.
    rpc GetTestTime(GetTestTimeRequest) returns (GetTestTimeResponse);

    // SetTestTime overwrites the daemon's injected application clock when
    // test-clock mode is enabled.
    rpc SetTestTime(SetTestTimeRequest) returns (SetTestTimeResponse);

    // AdvanceTestTime advances the daemon's injected application clock when
    // test-clock mode is enabled.
    rpc AdvanceTestTime(AdvanceTestTimeRequest)
        returns (AdvanceTestTimeResponse);

    // TimerIntercept streams labeled logical waits when test-clock mode is
    // enabled.
    rpc TimerIntercept(TimerInterceptRequest)
        returns (stream TimerInterceptEvent);

    // Init initializes the daemon storage with the main password before the
    // first unlock.
    rpc Init(InitRequest) returns (InitResponse);

    // Unlock sends the main password to the daemon. The password is used to
    // derive the master secret key from which all other keys are derived,
    // for encryption, onion service private key, and for authentication.
    rpc Unlock(UnlockRequest) returns (UnlockResponse);

    // Stop asks the daemon to shut down gracefully.
    rpc Stop(StopRequest) returns (StopResponse);

    // ConnectPeer adds the peer to the list of known peers. The daemon will
    // try to connect to it.
    rpc ConnectPeer(ConnectPeerRequest) returns (ConnectPeerResponse);

    // PinPeer marks a peer as operator-pinned so it keeps the highest
    // priority in local peer policy.
    rpc PinPeer(PinPeerRequest) returns (PinPeerResponse);

    // UnpinPeer removes the operator pin from a peer.
    rpc UnpinPeer(UnpinPeerRequest) returns (UnpinPeerResponse);

    // Peers returns the current local peer inventory without probing peers
    // live over the network.
    rpc Peers(PeersRequest) returns (PeersResponse);

    // ExportBuiltInPeers renders the Rust source file for the compiled
    // built-in bootstrap peer list.
    rpc ExportBuiltInPeers(ExportBuiltInPeersRequest)
        returns (ExportBuiltInPeersResponse);

    // ListConflicts reports unresolved and archived conflicting revisions.
    rpc ListConflicts(ListConflictsRequest) returns (ListConflictsResponse);

    // CheckoutRevision returns the plaintext files for one conflicted or
    // archived revision so the operator can inspect it locally.
    rpc CheckoutRevision(CheckoutRevisionRequest)
        returns (CheckoutRevisionResponse);

    // ResolveConflict chooses the revision that should stay active and archives
    // the remaining conflicting revisions.
    rpc ResolveConflict(ResolveConflictRequest)
        returns (ResolveConflictResponse);

    // SetFile sends a single file to the daemon. The daemon assembles a
    // single content blob from the current set of files, stores it encrypted
    // locally, and uploads the resulting content to other peers (also
    // encrypted). It stores other peers' content in exchange.
    rpc SetFile(SetFileRequest) returns (SetFileResponse);

    // DeleteFile removes a file by name from the current content set.
    rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);

    // GetFile returns the file data by its name from the current set of
    // files that form the most recent content blob.
    rpc GetFile(GetFileRequest) returns (GetFileResponse);

    // ListFiles returns only the names of files that form the most recent
    // content blob.
    rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);

    // SetStorageConfig sets how much data of other peers we want to store
    // and what is the minimum number of replicas (peers) we want to store
    // data on. We also have obligations under old contracts (where peers are
    // offline but still have remaining time to download their data from us).
    // Given all of this it is possible to reduce the maximum content length
    // of another peer we accept into our storage.
    rpc SetStorageConfig(SetStorageConfigRequest)
        returns (SetStorageConfigResponse);

    // GetStorageConfig returns the current storage configuration.
    rpc GetStorageConfig(GetStorageConfigRequest)
        returns (GetStorageConfigResponse);

    // GetContracts returns the current state of storage contracts.
    rpc GetContracts(GetContractsRequest) returns (GetContractsResponse);

    // ProposeContract tells the server to form a contract if not already
    // present with the specified peer.
    rpc ProposeContract(ProposeContractRequest)
        returns (stream ProposeContractUpdate);

    // CheckContract tells the server to check the contract with the peer.
    // It verifies that we and the peer store the most recent versions of
    // contents of each other, then downloads a random piece of our content
    // from the peer and verifies it. Such checks are also run in the
    // background.
    rpc CheckContract(CheckContractRequest)
        returns (stream CheckContractUpdate);

    // RecoverContent triggers content recovery from peers. The daemon does
    // it on its own after starting and in the background. This just triggers
    // it. The stream works forever sending new recovery events.
    rpc RecoverContent(RecoverContentRequest)
        returns (stream RecoverContentUpdate);
}

// StateRequest is an empty local state request.
message StateRequest {}

// GetTestTimeRequest is an empty request for the daemon test clock.
message GetTestTimeRequest {}

// GetTestTimeResponse returns the daemon's current injected application time.
message GetTestTimeResponse {
    // unix_seconds is the current whole Unix second.
    uint64 unix_seconds = 1;

    // nanoseconds is the sub-second nanosecond component.
    uint32 nanoseconds = 2;
}

// SetTestTimeRequest overwrites the daemon's injected application time.
message SetTestTimeRequest {
    // unix_seconds is the target whole Unix second.
    uint64 unix_seconds = 1;

    // nanoseconds is the target sub-second nanosecond component.
    uint32 nanoseconds = 2;
}

// SetTestTimeResponse returns the updated injected application time.
message SetTestTimeResponse {
    // unix_seconds is the current whole Unix second after the update.
    uint64 unix_seconds = 1;

    // nanoseconds is the current sub-second nanosecond component after the
    // update.
    uint32 nanoseconds = 2;
}

// AdvanceTestTimeRequest advances the daemon's injected application time.
message AdvanceTestTimeRequest {
    // seconds is the whole-second part of the requested duration.
    uint64 seconds = 1;

    // nanoseconds is the sub-second nanosecond part of the requested
    // duration.
    uint32 nanoseconds = 2;
}

// AdvanceTestTimeResponse returns the updated injected application time.
message AdvanceTestTimeResponse {
    // unix_seconds is the current whole Unix second after the advance.
    uint64 unix_seconds = 1;

    // nanoseconds is the current sub-second nanosecond component after the
    // advance.
    uint32 nanoseconds = 2;
}

// TimerInterceptRequest subscribes to one hidden timer label.
message TimerInterceptRequest {
    // label is the exact internal timer label to observe.
    string label = 1;
}

// TimerInterceptEvent reports one observed logical timer registration.
message TimerInterceptEvent {
    // label is the internal timer label that was armed.
    string label = 1;

    // wait_seconds is the whole-second part of the requested duration.
    uint64 wait_seconds = 2;

    // wait_nanoseconds is the sub-second nanosecond part of the requested
    // duration.
    uint32 wait_nanoseconds = 3;

    // registered_unix_seconds is the logical time when the wait was armed.
    uint64 registered_unix_seconds = 4;

    // registered_nanoseconds is the logical sub-second component when the wait
    // was armed.
    uint32 registered_nanoseconds = 5;
}

// PeerRuntimeState reports whether the public peer runtime is ready yet.
enum PeerRuntimeState
{
    PEER_RUNTIME_STATE_UNKNOWN = 0;
    PEER_RUNTIME_STATE_STARTING = 1;
    PEER_RUNTIME_STATE_READY = 2;
    PEER_RUNTIME_STATE_FAILED = 3;
}

// SelfPeerCheckState reports whether the daemon can reach its own peer RPC.
enum SelfPeerCheckState
{
    SELF_PEER_CHECK_STATE_UNKNOWN = 0;
    SELF_PEER_CHECK_STATE_HEALTHY = 1;
    SELF_PEER_CHECK_STATE_UNHEALTHY = 2;
}

// StateResponse returns local daemon status information.
message StateResponse {
    // storage_initialized reports whether the daemon data directory already
    // contains the main-password fingerprint and therefore cannot be
    // initialized again.
    bool storage_initialized = 7;

    // server_onion is the Tor onion hostname of the local daemon.
    string server_onion = 1;

    // uptime_seconds is the number of seconds since the daemon started.
    int64 uptime_seconds = 2;

    // peer_runtime_state reports whether the public peer runtime is still
    // starting, ready, or failed after unlock.
    PeerRuntimeState peer_runtime_state = 3;

    // peer_runtime_error contains the latest peer runtime failure, if any.
    string peer_runtime_error = 4;

    // self_peer_check_state reports whether the daemon can reach its own
    // public peer RPC path through the configured transport.
    SelfPeerCheckState self_peer_check_state = 5;

    // self_peer_check_error contains the latest self-check failure, if any.
    string self_peer_check_error = 6;
}

message InitRequest {
    // main_password is the main password used to derive the master secret.
    string main_password = 1;
}

message InitResponse {}

message UnlockRequest {
    // main_password is the main password used to derive the master secret.
    string main_password = 1;
}

message UnlockResponse {}

message StopRequest {}

message StopResponse {}

message Peer {
    // onion_service_id is the Tor onion service identifier of the peer.
    string onion_service_id = 1;
}

message ConnectPeerRequest {
    // peer is the peer to add to the list of known peers.
    Peer peer = 1;
}

message ConnectPeerResponse {}

message PinPeerRequest {
    // peer is the peer whose operator pin state should be enabled.
    Peer peer = 1;
}

message PinPeerResponse {}

message UnpinPeerRequest {
    // peer is the peer whose operator pin state should be disabled.
    Peer peer = 1;
}

message UnpinPeerResponse {}

message PeersRequest {}

enum PeerStatus
{
    PEER_STATUS_UNKNOWN = 0;
    PEER_STATUS_CONNECTED = 1;
    PEER_STATUS_ONLINE = 2;
    PEER_STATUS_OFFLINE = 3;
}

enum PeerFailureClass
{
    PEER_FAILURE_CLASS_UNKNOWN = 0;
    PEER_FAILURE_CLASS_TRANSPORT = 1;
    PEER_FAILURE_CLASS_TIMEOUT = 2;
    PEER_FAILURE_CLASS_STORAGE_BUDGET = 3;
    PEER_FAILURE_CLASS_OVERSIZE = 4;
    PEER_FAILURE_CLASS_CAPACITY = 5;
    PEER_FAILURE_CLASS_PROTOCOL = 6;
}

message PeerInfo {
    // peer identifies the peer being reported.
    Peer peer = 1;

    // status is the current locally observed transport status.
    PeerStatus status = 2;

    // has_contract reports whether persisted state indicates a current
    // contract relationship with this peer.
    bool has_contract = 3;

    // score_seconds is the peer's current persisted score.
    int64 score_seconds = 4;

    // score_measured_at is when score_seconds was last updated.
    int64 score_measured_at = 5;

    // stored_content_bytes is the amount of this peer's mirrored content we
    // currently keep locally.
    int64 stored_content_bytes = 6;

    // latest_known_content_length is the newest peer revision length we know
    // exists.
    int64 latest_known_content_length = 7;

    // latest_cached_content_length is the newest peer revision length we cache
    // locally.
    int64 latest_cached_content_length = 8;

    // stale_cache reports whether latest known and latest cached revisions
    // differ.
    bool stale_cache = 9;

    // last_live_at is when the peer last answered successfully over the
    // transport.
    int64 last_live_at = 10;

    // last_failure_at is when background peer maintenance last failed.
    int64 last_failure_at = 11;

    // last_error_class classifies the most recent background maintenance
    // failure.
    PeerFailureClass last_error_class = 12;

    // last_error_message is the daemon's last failure summary for this peer.
    string last_error_message = 13;

    // consecutive_failures is the current background maintenance failure
    // streak.
    int64 consecutive_failures = 14;

    // next_retry_at is the next scheduled background maintenance retry time
    // for this peer.
    int64 next_retry_at = 15;

    // pinned_by_us reports whether the local operator pinned this peer.
    bool pinned_by_us = 16;
}

message PeersResponse {
    // peers is the current local peer inventory in deterministic order.
    repeated PeerInfo peers = 1;
}

message ExportBuiltInPeersRequest {}

message ExportBuiltInPeersResponse {
    // rust_source is the complete Rust source file for the built-in peer list.
    string rust_source = 1;
}

message ListConflictsRequest {}

message ConflictRevisionInfo {
    // content_id is the encrypted revision identifier.
    bytes content_id = 1;

    // created_at is the Unix timestamp (seconds) encoded in the revision.
    int64 created_at = 2;

    // created_at_ns is the nanosecond component corresponding to created_at.
    int64 created_at_ns = 3;

    // content_length is the encrypted blob length in bytes.
    int64 content_length = 4;

    // file_count is the number of logical user files in the revision.
    int64 file_count = 5;

    // source_peer_onion is the peer from which the revision was downloaded.
    string source_peer_onion = 6;

    // source_is_local reports whether the revision came from the local active
    // state rather than a peer download.
    bool source_is_local = 7;

    // unresolved is true while the revision still belongs to the active
    // unresolved conflict set.
    bool unresolved = 8;

    // resolved_at is the Unix timestamp (seconds) when the operator chose a
    // different revision and archived this one.
    int64 resolved_at = 9;

    // resolved_at_ns is the nanosecond component corresponding to resolved_at.
    int64 resolved_at_ns = 10;
}

message ListConflictsResponse {
    // revisions lists unresolved and archived conflicting revisions.
    repeated ConflictRevisionInfo revisions = 1;
}

message CheckoutRevisionRequest {
    // content_id identifies the revision to inspect.
    bytes content_id = 1;
}

message CheckoutRevisionResponse {
    // file contains the plaintext file set from the selected revision.
    repeated File file = 1;
}

message ResolveConflictRequest {
    // content_id identifies the revision that should stay active.
    bytes content_id = 1;
}

message ResolveConflictResponse {}

// File represents a single user-provided file that participates in forming
// the current content blob.
message File {
    // name is an arbitrary identifier shown to the user (for example,
    // a filename).
    string name = 1;

    // data is the raw file bytes.
    bytes data = 2;
}

message SetFileRequest {
    // file is the file to add or update in the current content set.
    File file = 1;
}

message SetFileResponse {}

message DeleteFileRequest {
    // name is the name of the file to delete from the current content set.
    string name = 1;
}

message DeleteFileResponse {}

message GetFileRequest {
    // name is the name of the file to fetch from the current content.
    string name = 1;
}

message GetFileResponse {
    // file is the requested file from the current content set.
    File file = 1;
}

message ListFilesRequest {}

message ListFilesResponse {
    // name contains names of files that form the most recent content blob.
    repeated string name = 1;
}

// StorageConfig has settings that the user can change.
message StorageConfig {
    // allocated_storage_for_peers is the total number of bytes allocated to
    // store other peers' content.
    int64 allocated_storage_for_peers = 1;

    // min_replicas is the minimum number of peers to store our content on.
    int64 min_replicas = 2;
}

// StorageInfo is inferred data about storage configuration which the user
// can read, but can not change.
message StorageInfo {
    // online_peers_storage_obligations_bytes is total number of bytes we
    // spend on storing data of peers which are currently online and store
    // our most recent content properly.
    int64 online_peers_storage_obligations_bytes = 1;

    // offline_peers_storage_obligations_bytes is total number of bytes we
    // spend on storing data of peers which are currently offline or who store
    // an outdated version of our content.
    int64 offline_peers_storage_obligations_bytes = 2;

    // expired_offline_peers_storage_obligations_bytes is a subset of
    // offline_peers_storage_obligations_bytes where the remote peer's
    // score is negative.
    int64 expired_offline_peers_storage_obligations_bytes = 3;

    // our_content_bytes is the number of bytes in our encrypted content.
    int64 our_content_bytes = 4;

    // maximum_peer_content_accepted_bytes is the maximum size of a remote
    // peer's content we can accept.
    int64 maximum_peer_content_accepted_bytes = 5;
}

// ResourcePolicy is the current read-only runtime policy for peer transfers
// and related operator-visible limits.
message ResourcePolicy {
    // max_peer_content_bytes is the largest encrypted peer blob the current
    // protocol is willing to move as one whole revision.
    int64 max_peer_content_bytes = 1;

    // peer_grpc_message_limit_bytes is the largest peer gRPC message the
    // daemon accepts.
    int64 peer_grpc_message_limit_bytes = 2;

    // peer_connect_timeout_ms bounds one outbound peer dial attempt.
    int64 peer_connect_timeout_ms = 3;

    // peer_rpc_timeout_ms bounds one peer RPC once connected.
    int64 peer_rpc_timeout_ms = 4;

    // peer_operation_total_budget_ms bounds one whole logical peer operation
    // across retries.
    int64 peer_operation_total_budget_ms = 5;

    // peer_retry_initial_backoff_ms is the first retry delay after one failed
    // peer attempt.
    int64 peer_retry_initial_backoff_ms = 6;

    // peer_retry_max_backoff_ms caps retry delay growth between peer attempts.
    int64 peer_retry_max_backoff_ms = 7;

    // max_tracked_peers is the maximum number of peers the daemon keeps in
    // peer metadata.
    int64 max_tracked_peers = 8;

    // max_cached_peer_clients is the maximum number of cached outbound peer
    // gRPC clients the daemon keeps in memory.
    int64 max_cached_peer_clients = 9;

    // chunking_supported reports whether the daemon can transfer one peer
    // revision in multiple chunks instead of as one whole blob.
    bool chunking_supported = 10;
}

message SetStorageConfigRequest {
    // config is the new storage configuration to apply.
    StorageConfig config = 1;
}

message SetStorageConfigResponse {}

message GetStorageConfigRequest {}

message GetStorageConfigResponse {
    // config is the current storage configuration.
    StorageConfig config = 1;

    // info reports derived storage information and capacity.
    StorageInfo info = 2;

    // resource_policy reports the current read-only peer transfer limits and
    // related runtime ceilings.
    ResourcePolicy resource_policy = 3;
}

message GetContractsRequest {}

// ContractInfo holds important information about a contract with a peer.
message ContractInfo {
    // peer specifies the peer with which there is this contract.
    Peer peer = 1;

    // our_content_synced specifies if the peer stores the most recent version
    // of our content.
    bool our_content_synced = 2;

    // our_remaining_seconds specifies our score from the peer's perspective.
    // The longer we have stored their content properly, the higher this number.
    int64 our_remaining_seconds = 3;

    // their_remaining_seconds specifies peer's score from our perspective.
    // The longer the peer stored our content properly, the higher this number.
    int64 their_remaining_seconds = 4;

    // their_content_length is the number of bytes we spend on storing the
    // content of this peer.
    int64 their_content_length = 5;

    // online indicates if the peer is online now.
    bool online = 6;

    // their_latest_known_content_id is the newest peer revision we know exists.
    bytes their_latest_known_content_id = 7;

    // their_latest_known_content_length is the size of the newest known peer
    // revision in bytes.
    int64 their_latest_known_content_length = 8;

    // their_latest_cached_content_id is the newest peer revision we currently
    // keep cached locally.
    bytes their_latest_cached_content_id = 9;

    // their_latest_cached_content_length is the size of the newest cached peer
    // revision in bytes.
    int64 their_latest_cached_content_length = 10;
}

message GetContractsResponse {
    repeated ContractInfo contracts = 1;
}

// ProposeContractRequest asks the daemon to create or renew a contract with
// a specific peer.
message ProposeContractRequest {
    // peer is the peer to negotiate with.
    Peer peer = 1;
}

enum ContractState
{
    // NOT_STARTED means the operation has not begun.
    NOT_STARTED = 0;

    // CONNECTING_TO_PEER means we are connecting to the peer.
    CONNECTING_TO_PEER = 1;

    // PROPOSING_CONTRACT means we are proposing a contract to the peer.
    PROPOSING_CONTRACT = 2;

    // PEER_REFUSED means the peer refused to form or renew a contract.
    PEER_REFUSED = 3;

    // SYNCING_CONTENTS means we and the peer are downloading data or
    // each other.
    SYNCING_CONTENTS = 4;

    // CHECKING_CONTENTS means we are verifying stored content.
    CHECKING_CONTENTS = 5;

    // OUR_CONTENT_REVISION_MISSING means our content revision is missing on
    // the peer.
    OUR_CONTENT_REVISION_MISSING = 6;

    // INVALID_CONTENT_RETURNED means the peer returned invalid content when
    // we were checking it.
    INVALID_CONTENT_RETURNED = 7;

    // COMPLETED means the operation finished successfully.
    COMPLETED = 8;

    // PEER_UNAVAILABLE means we could not complete the check because the peer
    // stayed unreachable or failed to serve the requested data before the
    // retry budget expired.
    PEER_UNAVAILABLE = 9;
};

// ProposeContractUpdate reports progress or status changes while proposing a
// contract.
message ProposeContractUpdate {
    // state is the current contract proposal state.
    ContractState state = 1;

    // success is true when the proposal finished successfully.
    bool success = 2;

    // their_content_length is the size of the peer's content in bytes.
    int64 their_content_length = 3;

    // their_content_downloaded_bytes is the downloaded portion in bytes.
    int64 their_content_downloaded_bytes = 4;

    // our_content_length is our content size in bytes.
    int64 our_content_length = 5;

    // our_content_uploaded_bytes is the uploaded portion in bytes.
    int64 our_content_uploaded_bytes = 6;
}

// CheckContractRequest asks the daemon to verify a contract with a peer.
message CheckContractRequest {
    // peer is the peer to check.
    Peer peer = 1;
}

// CheckContractUpdate reports progress or status during a contract check.
message CheckContractUpdate {
    // state is the current contract check state.
    ContractState state = 1;

    // success is true when the check finished successfully.
    bool success = 2;

    // our_content_length is our content size in bytes.
    int64 our_content_length = 3;

    // our_content_section_offset is the offset of the sampled section.
    int64 our_content_section_offset = 4;

    // our_content_section_length is the length of the sampled section.
    int64 our_content_section_length = 5;
}

// RecoverContentRequest triggers content recovery workflow.
message RecoverContentRequest {}

// RecoverContentUpdate reports recovery progress and events.
message RecoverContentUpdate {
    // most_recent_content_id is the content_id of the most recent version.
    bytes most_recent_content_id = 1;

    // most_recent_ts is the Unix timestamp (seconds) of the most recent
    // revision.
    int64 most_recent_ts = 2;

    // most_recent_ts_ns is the nanosecond component corresponding to
    // most_recent_ts.
    int64 most_recent_ts_ns = 3;

    // most_recent_length is the byte length of the most recent version.
    int64 most_recent_length = 4;

    // num_peers_with_most_recent_version is the number of peers that have the
    // most recent version.
    int64 num_peers_with_most_recent_version = 5;

    // total_versions_found is the total number of content versions discovered.
    int64 total_versions_found = 6;

    // num_peers_with_any_versions is the number of peers that have any
    // version of our content.
    int64 num_peers_with_any_versions = 7;

    // most_recent_downloaded_bytes is the number of bytes downloaded for the
    // most recent version.
    int64 most_recent_downloaded_bytes = 8;

    // most_recent_downloaded_files is the number of files recovered for the
    // most recent version.
    int64 most_recent_downloaded_files = 9;

    // total_downloaded_bytes is the total number of bytes recovered.
    int64 total_downloaded_bytes = 10;

    // recovered_most_recent_version indicates whether the most recent version
    // has been fully recovered.
    bool recovered_most_recent_version = 11;

    // freshest_recoverable_content_id is the newest version that was actually
    // available from at least one peer.
    bytes freshest_recoverable_content_id = 12;

    // freshest_recoverable_ts is the Unix timestamp (seconds) of the newest
    // version that was actually available to download.
    int64 freshest_recoverable_ts = 13;

    // freshest_recoverable_ts_ns is the nanosecond component corresponding to
    // freshest_recoverable_ts.
    int64 freshest_recoverable_ts_ns = 14;

    // freshest_recoverable_length is the byte length of the newest version
    // that was actually available to download.
    int64 freshest_recoverable_length = 15;

    // num_peers_with_freshest_recoverable_version is the number of peers that
    // could actually serve the freshest recoverable version.
    int64 num_peers_with_freshest_recoverable_version = 16;

    // recovered_fallback_version indicates that recovery succeeded only by
    // falling back from the newest known version to an older available one.
    bool recovered_fallback_version = 17;
}
