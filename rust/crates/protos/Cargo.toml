[package]
name = "protos"
version = "0.1.0"
edition = "2021"

[lib]
name = "protos"
path = "src/lib.rs"

[dependencies]
tonic = { version = "0.14.2", features = ["transport"] }
tonic-prost = "0.14.2"
prost = "0.14.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-prost-build = { version = "0.14.2" }
prost-build = { version = "0.14.1" }
protoc-bin-vendored = "3"
