[package]
name = "protos"
version = "0.1.0"
edition = "2021"

[lib]
name = "protos"
path = "src/lib.rs"

[dependencies]
tonic = { version = "0.11", features = ["transport"] }
prost = "0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
# Disabled: we commit generated code; build.rs remains for reference but not used if files exist.
tonic-build = { version = "0.11", features = ["prost"], optional = true }
prost-build = { version = "0.13", optional = true }

[features]
gen = ["tonic-build", "prost-build"]
