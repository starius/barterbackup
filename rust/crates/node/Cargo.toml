[package]
name = "node"
version = "0.1.0"
edition = "2021"

[lib]
name = "node"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "0.11", features = ["transport"] }
protos = { path = "../protos" }
keys = { path = "../keys" }
sha2 = "0.10"
torut = { version = "0.2.1" }
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
protos = { path = "../protos" }
anyhow = "1"
tokio-stream = "0.1"
