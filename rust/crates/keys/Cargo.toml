[package]
name = "keys"
version = "0.1.0"
edition = "2021"

[lib]
name = "keys"
path = "src/lib.rs"

[dependencies]
argon2 = { version = "0.5", default-features = false, features = ["std"] }
hkdf = "0.12"
sha2 = "0.10"
ed25519-dalek = { version = "1.0", features = ["std"] }
thiserror = "1.0"

[dev-dependencies]
hex = "0.4"
rand = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
anyhow = "1"
protos = { path = "../protos" }

