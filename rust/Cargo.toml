[workspace]
members = [
    "crates/protos",
    "crates/keys",
    "crates/content",
    "crates/storage",
    "crates/node",
    "crates/clitls",
    "crates/netmock",
    "crates/nettor",
    "cmd/bbd",
    "cmd/bbcli",
]

resolver = "2"

# Build the lightweight crates by default to avoid requiring `protoc`.
# Full build: `cargo build --workspace` after generating protos.
default-members = [
    "crates/keys",
]
