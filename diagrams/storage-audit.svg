<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">Storage audit that prevents proxy fetching</title>
  <desc id="desc">The group chooses an unpredictable byte position and temporarily stops serving it. The target parity holder must return those bytes with a Merkle proof, which the group checks against the committed root.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 22px; font-weight: 700; }
      .step { font-size: 15px; font-weight: 700; fill: #ffffff; }
      .label { font-size: 16px; font-weight: 650; }
      .small { font-size: 14px; fill: #475569; }
      .box { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .group { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .target { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; }
      .verify { fill: #fef3c7; stroke: #f59e0b; stroke-width: 2; }
      .badge { fill: #334155; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .blocked { stroke: #ef4444; stroke-width: 3; stroke-dasharray: 7 6; fill: none; marker-end: url(#redArrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <marker id="redArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="960" height="450" rx="18" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="heading">A short proof-of-storage audit</text>

  <rect x="52" y="84" width="240" height="120" rx="15" class="group"/>
  <circle cx="79" cy="105" r="15" class="badge"/>
  <text x="79" y="110" text-anchor="middle" class="step">1</text>
  <text x="172" y="134" text-anchor="middle" class="label">Choose a random position</text>
  <text x="172" y="160" text-anchor="middle" class="small">Example: one 32-byte leaf</text>
  <text x="172" y="184" text-anchor="middle" class="small">The choice was not known early</text>

  <path d="M292 144 H353" class="arrow"/>
  <rect x="363" y="84" width="234" height="120" rx="15" class="box"/>
  <circle cx="390" cy="105" r="15" class="badge"/>
  <text x="390" y="110" text-anchor="middle" class="step">2</text>
  <text x="480" y="134" text-anchor="middle" class="label">Pause serving that part</text>
  <text x="480" y="160" text-anchor="middle" class="small">All other holders temporarily</text>
  <text x="480" y="184" text-anchor="middle" class="small">withhold the same position</text>

  <path d="M597 144 H658" class="arrow"/>
  <rect x="668" y="84" width="240" height="120" rx="15" class="target"/>
  <circle cx="695" cy="105" r="15" class="badge"/>
  <text x="695" y="110" text-anchor="middle" class="step">3</text>
  <text x="788" y="134" text-anchor="middle" class="label">Challenge parity holder</text>
  <text x="788" y="160" text-anchor="middle" class="small">Return the bytes plus</text>
  <text x="788" y="184" text-anchor="middle" class="small">a Merkle proof</text>

  <path d="M788 204 V265 H574" class="arrow"/>
  <rect x="363" y="275" width="234" height="112" rx="15" class="verify"/>
  <circle cx="390" cy="296" r="15" class="badge"/>
  <text x="390" y="301" text-anchor="middle" class="step">4</text>
  <text x="480" y="326" text-anchor="middle" class="label">Check the commitment</text>
  <text x="480" y="351" text-anchor="middle" class="small">Valid bytes + proof = pass</text>
  <text x="480" y="375" text-anchor="middle" class="small">Missing or wrong = failed audit</text>

  <path d="M730 204 V240 H175 V265" class="blocked"/>
  <rect x="60" y="275" width="230" height="112" rx="15" fill="#fff1f2" stroke="#ef4444" stroke-width="2"/>
  <text x="175" y="311" text-anchor="middle" class="label">Proxy route is blocked</text>
  <text x="175" y="339" text-anchor="middle" class="small">A holder that deleted the block</text>
  <text x="175" y="364" text-anchor="middle" class="small">cannot fetch or rebuild it in time</text>
</svg>
