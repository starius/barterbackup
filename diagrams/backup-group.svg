<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Structure of a Reed-Solomon backup group</title>
  <desc id="desc">One hundred people keep their own data blocks. An encoding round creates thirty shared parity blocks stored by thirty other participants. Any one hundred of all one hundred and thirty blocks can recover the group.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .heading { font-size: 22px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 650; }
      .small { font-size: 14px; fill: #475569; }
      .data { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .parity { fill: #dcfce7; stroke: #22c55e; stroke-width: 2; }
      .process { fill: #f8fafc; stroke: #64748b; stroke-width: 2; }
      .note { fill: #fff7ed; stroke: #f97316; stroke-width: 2; }
      .arrow { stroke: #64748b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="960" height="420" rx="18" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" class="heading">One encoding group</text>

  <rect x="54" y="86" width="260" height="180" rx="16" class="data"/>
  <text x="184" y="121" text-anchor="middle" class="label">100 data holders</text>
  <g class="small" text-anchor="middle">
    <rect x="89" y="145" width="54" height="54" rx="8" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="157" y="145" width="54" height="54" rx="8" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="225" y="145" width="54" height="54" rx="8" fill="#ffffff" stroke="#60a5fa"/>
    <text x="116" y="178">D1</text>
    <text x="184" y="178">D2</text>
    <text x="252" y="178">D100</text>
    <text x="218" y="173">…</text>
  </g>
  <text x="184" y="228" text-anchor="middle" class="small">Each keeps their own 1 GB block</text>

  <path d="M314 176 H375" class="arrow"/>
  <rect x="385" y="118" width="190" height="116" rx="58" class="process"/>
  <text x="480" y="164" text-anchor="middle" class="label">Reed–Solomon</text>
  <text x="480" y="189" text-anchor="middle" class="small">encoding round</text>
  <text x="480" y="211" text-anchor="middle" class="small">100 data + 30 parity</text>
  <path d="M575 176 H636" class="arrow"/>

  <rect x="646" y="86" width="260" height="180" rx="16" class="parity"/>
  <text x="776" y="121" text-anchor="middle" class="label">30 parity holders</text>
  <g class="small" text-anchor="middle">
    <rect x="681" y="145" width="54" height="54" rx="8" fill="#ffffff" stroke="#4ade80"/>
    <rect x="749" y="145" width="54" height="54" rx="8" fill="#ffffff" stroke="#4ade80"/>
    <rect x="817" y="145" width="54" height="54" rx="8" fill="#ffffff" stroke="#4ade80"/>
    <text x="708" y="178">P1</text>
    <text x="776" y="178">P2</text>
    <text x="844" y="178">P30</text>
    <text x="810" y="173">…</text>
  </g>
  <text x="776" y="228" text-anchor="middle" class="small">Each keeps one shared 1 GB block</text>

  <rect x="170" y="306" width="620" height="72" rx="14" class="note"/>
  <text x="480" y="337" text-anchor="middle" class="label">130 committed blocks in total</text>
  <text x="480" y="361" text-anchor="middle" class="small">Any 100 available blocks can recover the group · up to 30 may be unavailable</text>
</svg>
