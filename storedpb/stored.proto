syntax = "proto3";

package storedpb;

// ContentRevision specifies a particular version of user content produced
// from client-provided files and set by a clirpc.SetFile call.
// AEAD(ContentRevision) is used as content_id in bbrpc. The content of this
// struct is used to derive the keys used for AEAD encryption of Metadata.
// The AEAD tag of Metadata is mixed into the derivation of the AES-CTR IV
// material for files. Files don't need AEAD, because their hashes are stored
// in Metadata.
message ContentRevision {
    // created_at is a Unix timestamp (seconds) at the time of a SetFile call.
    int64 created_at = 1;

    // created_at_ns is the nanosecond component corresponding to created_at.
    int64 created_at_ns = 2;

    // metadata_aead_length is the length of AEAD-encrypted Metadata in bytes.
    int64 metadata_aead_length = 3;
}

// FileHeader represents a single user-provided file that participates in
// forming the current content blob.
message FileHeader {
    // name is an arbitrary identifier shown to the user (for example,
    // a filename).
    string name = 1;

    // file_length is the length of the file in bytes.
    int64 file_length = 2;

    // file_sha256 is the SHA-256 hash of the file.
    bytes file_sha256 = 3;

    // modified_at is the Unix timestamp (seconds) of the source file mtime.
    int64 modified_at = 4;

    // modified_at_ns is the nanosecond component corresponding to modified_at.
    int64 modified_at_ns = 5;
}

// Peer is data about the peer that should survive a node reset.
enum PeerOrigin
{
    // PEER_ORIGIN_DISCOVERED means the peer was learned from another peer.
    PEER_ORIGIN_DISCOVERED = 0;

    // PEER_ORIGIN_BUILT_IN means the peer came from the compiled seed list.
    PEER_ORIGIN_BUILT_IN = 1;

    // PEER_ORIGIN_MANUAL means the operator added the peer explicitly.
    PEER_ORIGIN_MANUAL = 2;
}

// FirstContactDirection records which side connected to the other first.
enum FirstContactDirection
{
    // FIRST_CONTACT_DIRECTION_UNKNOWN means the direction was not recorded.
    FIRST_CONTACT_DIRECTION_UNKNOWN = 0;

    // FIRST_CONTACT_DIRECTION_OUTBOUND means we dialed the peer first.
    FIRST_CONTACT_DIRECTION_OUTBOUND = 1;

    // FIRST_CONTACT_DIRECTION_INBOUND means the peer dialed us first.
    FIRST_CONTACT_DIRECTION_INBOUND = 2;
}

// PeerReachability records the last observed transport reachability state.
enum PeerReachability
{
    // PEER_REACHABILITY_UNKNOWN means we have no recorded live probe outcome.
    PEER_REACHABILITY_UNKNOWN = 0;

    // PEER_REACHABILITY_ONLINE means the most recent completed transport
    // interaction reached the peer successfully.
    PEER_REACHABILITY_ONLINE = 1;

    // PEER_REACHABILITY_OFFLINE means the most recent completed transport
    // interaction failed because the peer could not be reached.
    PEER_REACHABILITY_OFFLINE = 2;
}

// PeerContent describes one peer-visible mirrored revision.
message PeerContent {
    // content_id is the peer's encrypted revision identifier.
    bytes content_id = 1;

    // content_length is the encrypted blob length in bytes.
    int64 content_length = 2;
}

// Peer is data about the peer that should survive a node reset.
message Peer {
    // onion_pubkey is the peer's onion service public key.
    bytes onion_pubkey = 1;

    // score_seconds is the accumulated availability score in seconds. The
    // higher, the better this peer was for us.
    int64 score_seconds = 2;

    // score_measured_at is a Unix timestamp (seconds) when score was measured.
    int64 score_measured_at = 3;

    // content_id is the legacy latest content identifier written by older
    // versions. Newer code keeps it in sync with latest_known_content for
    // migration compatibility.
    bytes content_id = 4;

    // latest_known_content is the newest peer revision we know exists.
    PeerContent latest_known_content = 5;

    // latest_cached_content is the newest peer revision we currently keep in
    // our local cache and can serve or inspect later.
    PeerContent latest_cached_content = 6;

    // origin is the highest-priority origin class recorded for this peer.
    PeerOrigin origin = 7;

    // first_contact_direction records who connected first, if known.
    FirstContactDirection first_contact_direction = 8;

    // reachability records whether the most recent completed transport
    // interaction reached the peer successfully.
    PeerReachability reachability = 9;

    // last_live_at is the Unix timestamp (seconds) when this peer last
    // responded successfully over the transport.
    int64 last_live_at = 10;

    // pinned_by_us reports whether the local operator pinned this peer.
    bool pinned_by_us = 11;

    // pins_us reports whether this peer most recently told us that it pins us.
    bool pins_us = 12;

    // our_content_last_verified_content_id is the most recent local content
    // revision that this peer successfully returned during a contract check.
    bytes our_content_last_verified_content_id = 13;

    // our_content_last_verified_at is when the last successful verification of
    // our content on this peer completed.
    int64 our_content_last_verified_at = 14;

    // first_seen_at is when this peer was first admitted into local tracked
    // peer state.
    int64 first_seen_at = 15;

    // first_seen_at_ns is the nanosecond component of first_seen_at.
    int64 first_seen_at_ns = 16;

    // successful_calls counts successful authenticated outbound peer
    // operations observed locally.
    int64 successful_calls = 17;

    // failed_calls counts failed outbound peer operations observed locally.
    int64 failed_calls = 18;

    // requester_latest_stored_content is the newest local-owner revision this
    // peer most recently reported that it still caches and can return.
    PeerContent requester_latest_stored_content = 19;

    // requester_latest_known_content is the newest local-owner revision this
    // peer most recently reported knowing about, even if it cannot return it.
    PeerContent requester_latest_known_content = 20;
}

// RecoveredRevision records one authenticated older-lineage revision that was
// already merged into the local file set.
message RecoveredRevision {
    // content_id is the encrypted revision identifier.
    bytes content_id = 1;

    // created_at is the authenticated Unix timestamp from the revision id.
    int64 created_at = 2;

    // created_at_ns is the authenticated nanosecond component.
    int64 created_at_ns = 3;
}

// Metadata is short data that is stored together with the main content on
// other peers and survives a node reset.
message Metadata {
    // files is the list of files stored as a concatenation in the content
    // after the metadata.
    repeated FileHeader files = 1;

    // peers is the list of known peers with some information about them.
    // Notes on updates:
    // - Peer updates (content_id, scores) are persisted immediately in
    //   local storage; this file acts as the durable DB for the daemon.
    // - Uploads of the whole local content blob are delayed to avoid an
    //   infinite upload loop when every peer update would change metadata
    //   and trigger another upload. Local file changes still trigger
    //   uploads promptly.
    repeated Peer peers = 2;

    // node_initialized_at is the local node-generation boundary recorded
    // when `bbcli init` succeeded.
    int64 node_initialized_at = 5;

    // node_initialized_at_ns is the nanosecond component of
    // node_initialized_at.
    int64 node_initialized_at_ns = 6;

    // latest_recovered_revision is the newest older-lineage revision that was
    // actually merged locally, if any.
    RecoveredRevision latest_recovered_revision = 7;

    // recovery_watermark_at is the newest older-lineage timestamp already
    // applied locally, or the initialization boundary after recovery mode is
    // finished.
    int64 recovery_watermark_at = 8;

    // recovery_watermark_at_ns is the nanosecond component of
    // recovery_watermark_at.
    int64 recovery_watermark_at_ns = 9;

    // recovery_mode_enabled blocks owner-originated publication until the
    // operator explicitly finishes recovery mode.
    bool recovery_mode_enabled = 10;

    // current_content is the active local revision summary persisted in the
    // sidecar so the node can restore that exact blob after a restart if the
    // local encrypted blob file is missing.
    PeerContent current_content = 11;
}
