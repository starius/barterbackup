[package]
name = "protos"
version = "0.1.0"
edition = "2021"

[lib]
name = "protos"
path = "src/lib.rs"

[dependencies]
tonic = { version = "0.14.5", features = ["transport"] }
tonic-prost = "0.14.5"
prost = "0.14.3"
prost-types = "0.14.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[build-dependencies]
tonic-prost-build = { version = "0.14.5" }
prost-build = { version = "0.14.3" }
protoc-bin-vendored = "3"
