[package]
name = "node"
version = "0.1.0"
edition = "2021"

[lib]
name = "node"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
content = { path = "../content" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14.2", features = ["transport", "tls-connect-info", "tls-ring"] }
protos = { path = "../protos" }
keys = { path = "../keys" }
storage = { path = "../storage" }
tlsutil = { path = "../tlsutil" }
transport = { path = "../transport" }
clock = { path = "../clock" }
sha2 = "0.10"
futures = "0.3"
ed25519-dalek = "1"
hex = "0.4"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
protos = { path = "../protos" }
anyhow = "1"
async-trait = "0.1"
content = { path = "../content" }
tokio-stream = { version = "0.1", features = ["net"] }
netmock = { path = "../netmock" }
