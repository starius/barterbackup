[target.x86_64-unknown-linux-musl]
# Prefer the canonical cross-compiler name used by Nix and many distros.
# If you use Debian/Ubuntu musl-tools, you can override with
#   CC_x86_64_unknown_linux_musl=musl-gcc
linker = "x86_64-unknown-linux-musl-gcc"

[target.aarch64-unknown-linux-musl]
# Prefer the canonical cross-compiler name used by Nix and many distros.
linker = "aarch64-unknown-linux-musl-gcc"

[target.x86_64-pc-windows-msvc]
# The MSVC Windows target can statically link the CRT while still using the
# platform DLLs that Windows itself provides.
rustflags = ["-C", "target-feature=+crt-static"]
