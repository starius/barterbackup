syntax = "proto3";

package bbrpc;

// BarterBackupServer is gRPC service implemented by BarterBackup daemon and
// exposed to the world as an onion site. BarterBackup nodes speak to each other
// using this protocol. A single main key must be used by a single instance of
// BarterBackup node as a time.
service BarterBackupServer {
    // HealthCheck returns success when the server is healthy.
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

    // PeerExchange shares peers (onion IDs) with the peer. This is needed for
    // peers to discover other peers in the network.
    rpc PeerExchange(PeerExchangeRequest) returns (PeerExchangeResponse);

    // GetContentRevision returns the most recent state of content IDs of both
    // nodes as recorded by the responding side.
    rpc GetContentRevision(GetContentRevisionRequest)
        returns (GetContentRevisionResponse);

    // SetContentRevision proposes another peer to download and store the data
    // referenced in the request. If peer agrees, it will respond successfully.
    rpc SetContentRevision(SetContentRevisionRequest)
        returns (SetContentRevisionResponse);

    // Download downloads a section of a file which can be content of either
    // the requester or the responder.
    rpc Download(DownloadRequest) returns (DownloadResponse);
}

// HealthCheckRequest is an empty health check request.
message HealthCheckRequest {}

// HealthCheckResponse is an empty health check response.
message HealthCheckResponse {
    // client_onion is the Tor onion hostname of the caller.
    string client_onion = 1;

    // server_onion is the Tor onion hostname of the server.
    string server_onion = 2;
}

message Peer {
    bytes onion_pubkey = 1;
}

message PeerExchangeRequest {
    repeated Peer peers = 1;
}

message PeerExchangeResponse {
    repeated Peer peers = 1;
}

message ContentInfo {
    bytes content_id = 1;
    int64 content_length = 2;
}

message GetContentRevisionRequest {}

message GetContentRevisionResponse {
    // requester_latest_stored_content is the newest requester revision that
    // the responder currently caches and can return on Download, if any.
    ContentInfo requester_latest_stored_content = 1;

    // requester_remaining_seconds is the amount of time the responder will
    // store the content of the requester if the requester does not store the
    // content of the responder.
    int64 requester_remaining_seconds = 2;

    // requester_latest_known_content is the newest requester revision the
    // responder knows about, even if it no longer caches that revision.
    ContentInfo requester_latest_known_content = 3;

    // requester_pinned reports whether the responder operator currently pins
    // the requester locally.
    bool requester_pinned = 4;
}

message SetContentRevisionRequest {
    // previous_requester_content is the newest requester revision the caller
    // believes the responder currently considers authoritative for this
    // identity. Callers use it as a compare-and-swap guard.
    ContentInfo previous_requester_content = 1;

    // requester_content is the description of the requester's content which
    // the requester wants the responder to download and store.
    // Behavior:
    // - If requester_content is provided, both content_id and content_length
    //   must be set and content_length must be positive.
    // - If requester_content is omitted (not set), the responder leaves any
    //   previously recorded requester content unchanged.
    ContentInfo requester_content = 2;
}

enum SetContentRevisionFailureReason
{
    SET_CONTENT_REVISION_FAILURE_REASON_UNKNOWN = 0;

    // PREVIOUS_REQUESTER_CONTENT_MISMATCH means the compare-and-swap guard
    // did not match the responder's latest known requester revision.
    SET_CONTENT_REVISION_FAILURE_REASON_PREVIOUS_REQUESTER_CONTENT_MISMATCH = 1;
}

message SetContentRevisionFailure {
    // reason is the machine-readable failure code for the rejected request.
    SetContentRevisionFailureReason reason = 1;
}

enum SetContentRevisionStorageResult
{
    SET_CONTENT_REVISION_STORAGE_RESULT_UNKNOWN = 0;

    // MIRRORED_BYTES_CACHED means the responder accepted the sidecar update
    // and currently caches the mirrored requester bytes locally.
    SET_CONTENT_REVISION_STORAGE_RESULT_MIRRORED_BYTES_CACHED = 1;

    // SIDECAR_ONLY means the responder accepted the sidecar update but did
    // not cache the mirrored requester bytes because local peer-storage space
    // was exhausted.
    SET_CONTENT_REVISION_STORAGE_RESULT_SIDECAR_ONLY = 2;
}

message SetContentRevisionResponse {
    // storage_result reports whether the responder accepted only metadata or
    // both metadata and mirrored bytes.
    SetContentRevisionStorageResult storage_result = 1;
}

message DownloadRequest {
    bytes content_id = 1;

    // offset is the byte offset inside the encrypted blob where the requested
    // section begins.
    int64 offset = 2;

    // length is the preferred number of bytes to return starting at `offset`.
    // The responder returns at most this many bytes and may return a shorter
    // tail section when `offset + length` would run past the end of the blob.
    int64 length = 3;

    // reference_content_id is an existing revision used in reference
    // sections. Optional.
    bytes reference_content_id = 4;
}

message RawBytes {
    bytes value = 1;
}

message Reference {
    int64 offset_in_reference = 1;
    int64 length = 2;
}

message DownloadResponse {
    int64 total_length = 1;

    // sha256 is sha256 hash sum of the file.
    bytes sha256 = 2;

    oneof section {
        RawBytes raw_bytes = 3;
        Reference reference = 4;
    }
}
